# ─────────────────────────────────────────────────────────────────────────────
# FitForge — nutrition-service Deployment
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: nutrition-service
  namespace: fitforge
  labels:
    app.kubernetes.io/name: nutrition-service
    app.kubernetes.io/part-of: fitforge
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: nutrition-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: nutrition-service
        app.kubernetes.io/part-of: fitforge
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: nutrition-service
          image: fitforge/nutrition-service:latest
          ports:
            - containerPort: 5004
              name: http
          envFrom:
            - configMapRef:
                name: nutrition-service-config

          startupProbe:
            httpGet:
              path: /nutrition/health
              port: 5004
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /nutrition/health
              port: 5004
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /nutrition/health
              port: 5004
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
