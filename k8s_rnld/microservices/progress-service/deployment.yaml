apiVersion: apps/v1
kind: Deployment
metadata:
  name: progress-service
  namespace: fitforge
  labels:
    app.kubernetes.io/name: progress-service
    app.kubernetes.io/part-of: fitforge
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: progress-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: progress-service
        app.kubernetes.io/part-of: fitforge
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: progress-service
          image: aswin018/k8s_mern_app_progress-service:v2
          ports:
            - containerPort: 5005
              name: http
          envFrom:
            - configMapRef:
                name: progress-service-config

          startupProbe:
            httpGet:
              path: /progress/health
              port: 5005
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /progress/health
              port: 5005
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /progress/health
              port: 5005
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi