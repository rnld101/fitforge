# ─────────────────────────────────────────────────────────────────────────────
# FitForge — auth-service Deployment
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: fitforge
  labels:
    app.kubernetes.io/name: auth-service
    app.kubernetes.io/part-of: fitforge
    app.kubernetes.io/component: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
        app.kubernetes.io/part-of: fitforge
        app.kubernetes.io/component: backend
    spec:
      containers:
        - name: auth-service
          image: fitforge/auth-service:latest
          ports:
            - containerPort: 5001
              name: http
          envFrom:
            - configMapRef:
                name: auth-service-config
            - secretRef:
                name: fitforge-app-secrets

          startupProbe:
            httpGet:
              path: /auth/health
              port: 5001
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12

          livenessProbe:
            httpGet:
              path: /auth/health
              port: 5001
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /auth/health
              port: 5001
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 200m
              memory: 256Mi
