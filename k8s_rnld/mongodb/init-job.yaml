# ─────────────────────────────────────────────────────────────────────────────
# FitForge — MongoDB Replica Set Init Job
#
# Runs ONCE after the StatefulSet pods are up. Executes the init script
# from the ConfigMap (rs-init.sh) to form the 3-member replica set.
#
# • Fully idempotent — skips if replica set already initialized
# • Retries on failure (backoffLimit: 10)
# • Auto-cleans up after completion (ttlSecondsAfterFinished: 120)
#
# If redeploying, delete the old Job first:
#   kubectl delete job mongo-rs-init -n fitforge --ignore-not-found
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: batch/v1
kind: Job
metadata:
  name: mongo-rs-init
  namespace: fitforge
  labels:
    app.kubernetes.io/name: mongodb
    app.kubernetes.io/part-of: fitforge
    app.kubernetes.io/component: init
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 600         # 10 min max runtime
  ttlSecondsAfterFinished: 120       # Auto-delete 2 min after completion
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mongo-rs-init
        app.kubernetes.io/part-of: fitforge
    spec:
      restartPolicy: OnFailure
      containers:
        - name: mongo-init
          image: mongo:7.0
          command: ["/bin/bash", "/scripts/rs-init.sh"]
          volumeMounts:
            - name: init-script
              mountPath: /scripts
              readOnly: true
      volumes:
        - name: init-script
          configMap:
            name: mongo-init-script
            defaultMode: 0755
