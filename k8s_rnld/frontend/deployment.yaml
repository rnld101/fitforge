# ─────────────────────────────────────────────────────────────────────────────
# FitForge — Frontend Deployment (React + nginx)
#
# nginx serves the built React SPA and proxies /api/* requests to the
# corresponding backend services using K8s internal DNS.
# The nginx.conf inside the image already has the correct proxy_pass rules.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: fitforge
  labels:
    app.kubernetes.io/name: frontend
    app.kubernetes.io/part-of: fitforge
    app.kubernetes.io/component: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
        app.kubernetes.io/part-of: fitforge
        app.kubernetes.io/component: frontend
    spec:
      containers:
        - name: frontend
          image: fitforge/frontend:latest
          ports:
            - containerPort: 3000
              name: http

          livenessProbe:
            httpGet:
              path: /
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: 3000
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 100m
              memory: 128Mi
