# ─────────────────────────────────────────────────────────────────────────────
# FitForge — Application Secrets
#
# ⚠️  IMPORTANT: Replace ALL placeholder values below BEFORE deploying!
#
# 🔑 Secrets to update:
#    1. JWT_SECRET      — Used by auth-service, user-service, workout-service
#                         Generate with: openssl rand -base64 48
#    2. GOOGLE_API_KEY  — Used by ai-agent-service (Google AI / Gemini)
#                         Get from: https://ai.google.dev/
#    3. LLM_MODEL       — Gemini model name for ai-agent-service
#
# Using stringData (plain text) for readability. K8s auto-encodes to base64.
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: fitforge-app-secrets
  namespace: fitforge
  labels:
    app.kubernetes.io/part-of: fitforge
type: Opaque
stringData:
  JWT_SECRET: "CHANGE-ME-use-a-long-random-string"
  GOOGLE_API_KEY: "CHANGE-ME-your-google-ai-api-key"
  LLM_MODEL: "gemini-2.5-flash-lite"
